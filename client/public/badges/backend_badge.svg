<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="goldPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="purpleNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7e22ce" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Cyber Diamond Shield -->
  <polygon points="60,6 112,42 96,108 60,116 24,108 8,42" fill="url(#purpleBg)" stroke="url(#goldPurple)" stroke-width="3" filter="url(#purpleNeon)"/>
  
  <!-- Database Cylinder 1 (Top) -->
  <ellipse cx="60" cy="38" rx="22" ry="7" fill="url(#violetGlow)"/>
  <path d="M 38,38 L 38,48 C 38,52 48,55 60,55 C 72,55 82,52 82,48 L 82,38" fill="url(#violetGlow)" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Database Cylinder 2 (Middle) -->
  <path d="M 38,51 L 38,61 C 38,65 48,68 60,68 C 72,68 82,65 82,61 L 82,51" fill="url(#violetGlow)" stroke="#c084fc" stroke-width="1.5" opacity="0.8"/>

  <!-- Database Cylinder 3 (Bottom) -->
  <path d="M 38,64 L 38,74 C 38,78 48,81 60,81 C 72,81 82,78 82,74 L 82,64" fill="url(#violetGlow)" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>

  <!-- Server Activity LED Lights -->
  <circle cx="48" cy="48" r="1.5" fill="#4ade80"/>
  <circle cx="54" cy="48" r="1.5" fill="#38bdf8"/>
  <circle cx="48" cy="61" r="1.5" fill="#4ade80"/>
  <circle cx="54" cy="61" r="1.5" fill="#facc15"/>
  <circle cx="48" cy="74" r="1.5" fill="#4ade80"/>
  <circle cx="54" cy="74" r="1.5" fill="#38bdf8"/>

  <!-- Verified Backend Pill -->
  <rect x="28" y="88" width="64" height="16" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>
  <text x="60" y="99.5" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BACKEND</text>
</svg>

