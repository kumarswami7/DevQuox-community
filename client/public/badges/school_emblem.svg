<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldSchool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadowSch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer Octagon Badge -->
  <polygon points="60,6 98,22 114,60 98,98 60,114 22,98 6,60 22,22" fill="url(#emeraldGrad)" stroke="url(#goldSchool)" stroke-width="3" filter="url(#shadowSch)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#goldSchool)" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Rising Sun Motif -->
  <path d="M 44,48 A 16,16 0 0,1 76,48 Z" fill="url(#goldSchool)"/>
  <line x1="60" y1="28" x2="60" y2="24" stroke="url(#goldSchool)" stroke-width="2"/>
  <line x1="48" y1="32" x2="45" y2="29" stroke="url(#goldSchool)" stroke-width="2"/>
  <line x1="72" y1="32" x2="75" y2="29" stroke="url(#goldSchool)" stroke-width="2"/>

  <!-- Open Scholastic Book -->
  <path d="M 60,56 C 53,50 43,50 38,53 L 38,72 C 43,69 53,69 60,75 C 67,69 77,69 82,72 L 82,53 C 77,50 67,50 60,56 Z" fill="#ffffff" stroke="url(#goldSchool)" stroke-width="2"/>
  <line x1="60" y1="56" x2="60" y2="75" stroke="url(#goldSchool)" stroke-width="2"/>

  <!-- Education Torch Flame -->
  <path d="M 60,36 C 58,40 56,43 58,47 C 60,49 62,49 62,47 C 64,43 62,40 60,36 Z" fill="#f97316"/>

  <!-- School Ribbon -->
  <rect x="36" y="84" width="48" height="15" rx="4" fill="url(#goldSchool)"/>
  <text x="60" y="95" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="1">SCHOOL</text>
</svg>

