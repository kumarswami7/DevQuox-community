<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Futuristic Hexagon Shield -->
  <polygon points="60,6 108,30 108,90 60,114 12,90 12,30" fill="url(#cyberBg)" stroke="url(#hexBorder)" stroke-width="3" filter="url(#neon)"/>
  <polygon points="60,14 100,34 100,86 60,106 20,86 20,34" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  
  <!-- Stack Layers Motif -->
  <path d="M 38,42 L 60,32 L 82,42 L 60,52 Z" fill="url(#cyanGlow)" opacity="0.9"/>
  <path d="M 38,56 L 60,46 L 82,56 L 60,66 Z" fill="url(#cyanGlow)" opacity="0.6"/>
  <path d="M 38,70 L 60,60 L 82,70 L 60,80 Z" fill="url(#cyanGlow)" opacity="0.3"/>

  <!-- Code Brackets Overlay -->
  <path d="M 30,58 L 22,66 L 30,74" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 90,58 L 98,66 L 90,74" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Verified Tech Pill -->
  <rect x="26" y="86" width="68" height="16" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="97.5" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">FULL STACK</text>
</svg>

