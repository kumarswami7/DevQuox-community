<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Crest Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Shield Base -->
  <path d="M 40,32 L 80,32 C 80,55 75,76 60,86 C 45,76 40,55 40,32 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Academic Open Book -->
  <path d="M 60,54 C 54,49 46,49 43,51 L 43,66 C 46,64 54,64 60,69 C 66,64 74,64 77,66 L 77,51 C 74,49 66,49 60,54 Z" fill="url(#goldGrad)"/>
  <path d="M 60,54 L 60,69" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Academic Star of Excellence -->
  <polygon points="60,37 62,42 67,42 63,45 65,50 60,47 55,50 57,45 53,42 58,42" fill="url(#goldGrad)"/>

  <!-- Laurel Wreath Leaves on Sides -->
  <path d="M 28,45 C 24,55 26,70 34,79 M 92,45 C 96,55 94,70 86,79" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Banner Ribbon at Bottom -->
  <path d="M 32,88 L 60,94 L 88,88 L 84,98 L 60,103 L 36,98 Z" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1"/>
  <text x="60" y="99" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">RGUKT</text>
</svg>

